services:
  - type: web
    name: fortross-linkedin-api
    runtime: python
    plan: free
    buildCommand: pip install .
    startCommand: uvicorn fortross.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: LINKEDIN_LIVE_ENABLED
        value: "false"
      - key: LINKEDIN_PROFILE_ACCESS
        value: "allowlist"
      - key: LINKEDIN_MAX_CONCURRENCY
        value: "1"
      - key: LINKEDIN_MAX_RETRIES
        value: "0"
      - key: API_KEY
        sync: false
      - key: LINKEDIN_LI_AT
        sync: false
      - key: LINKEDIN_JSESSIONID
        sync: false
      - key: ALLOWED_PROFILE_SLUGS
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
